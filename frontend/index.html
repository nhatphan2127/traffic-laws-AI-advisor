<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Legal Advisor - Expert Mode</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fira+Code:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-top">
            <div class="sidebar-header">⚖ AI Legal Advisor</div>
            <div class="new-chat" onclick="startNewConversation()">+ New Conversation</div>
            <div class="history" id="chatHistory"></div>
        </div>

        <div class="user-auth-section" id="authSection">
            <!-- JS sẽ điền thông tin user hoặc nút Đăng nhập ở đây -->
        </div>
    </aside>

    <main class="main-chat">
        <div class="chat-container" id="chatContainer">
            <div style="height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #0d0d0d;"
                id="welcomeView">
                <h1 style="font-size: 28px; font-weight: 600; margin-bottom: 8px;">Legal Reasoning Engine</h1>
                <p style="font-size: 14px; color: #6e6e80;">Truy xuất đa tầng &amp; Phân tích chuyên sâu luật Việt Nam</p>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <textarea class="chat-input" id="userInput" placeholder="Hỏi về quy định, mức phạt, thủ tục..."
                    rows="1"></textarea>
                <button class="send-btn" id="sendBtn">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M15 8L1 15L3 8L1 1L15 8Z" fill="currentColor" />
                    </svg>
                </button>
            </div>
        </div>
    </main>

    <aside class="retrieval-panel">
        <div class="panel-header">Knowledge Base (RAG)</div>
        <div class="doc-list" id="docList">
            <div style="text-align: center; padding-top: 60px; color: #b0b0bb; font-size: 13px;">No documents retrieved yet.</div>
        </div>
    </aside>

    <!-- Modal Đăng nhập / Đăng ký -->
    <div class="modal" id="authModal">
        <div class="modal-content">
            <h3 id="modalTitle">Đăng nhập</h3>
            <form id="authForm" onsubmit="handleAuthSubmit(event)">
                <div class="form-group">
                    <label>Tên đăng nhập</label>
                    <input type="text" id="authUsername" required>
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="authPassword" required>
                </div>
                <div id="authError" style="color: #d1293d; font-size: 12px; margin-bottom: 8px; display: none;"></div>
                <button type="submit" class="auth-btn" id="authSubmitBtn">Đăng nhập</button>
            </form>
            <div class="toggle-auth" id="toggleAuthBtn" onclick="toggleAuthMode()">Chưa có tài khoản? Đăng ký ngay</div>
            <button class="auth-btn" style="background: #f0f0f1; color: #0d0d0d; margin-top: 8px;" onclick="closeAuthModal()">Hủy</button>
        </div>
    </div>

    <script>
        if (typeof marked !== 'undefined') {
            marked.setOptions({ gfm: true, breaks: true });
        }

        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const docList = document.getElementById('docList');
        const welcomeView = document.getElementById('welcomeView');
        const authSection = document.getElementById('authSection');
        const chatHistoryContainer = document.getElementById('chatHistory');

        let chatHistory = [];
        let isProcessing = false;
        let activeChatId = null;
        let isRegisterMode = false;

        // --- Init Auth Status ---
        function checkAuthStatus() {
            const token = localStorage.getItem('token');
            const username = localStorage.getItem('username');

            if (token && username) {
                authSection.innerHTML = `
                    <div style="font-size: 13px; color: #0d0d0d; margin-bottom: 6px;">👤 <b>${username}</b></div>
                    <button class="auth-btn logout-btn" onclick="logout()">Đăng xuất</button>
                `;
                fetchUserChats();
            } else {
                authSection.innerHTML = `
                    <button class="auth-btn" onclick="openAuthModal()">Đăng nhập / Đăng ký</button>
                `;
                chatHistoryContainer.innerHTML = '';
            }
        }

        checkAuthStatus();

        function openAuthModal() {
            document.getElementById('authModal').classList.add('show');
        }
        function closeAuthModal() {
            document.getElementById('authModal').classList.remove('show');
        }

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('modalTitle').textContent = isRegisterMode ? 'Đăng ký' : 'Đăng nhập';
            document.getElementById('authSubmitBtn').textContent = isRegisterMode ? 'Đăng ký' : 'Đăng nhập';
            document.getElementById('toggleAuthBtn').textContent = isRegisterMode ? 'Đã có tài khoản? Đăng nhập' : 'Chưa có tài khoản? Đăng ký ngay';
        }

        async function handleAuthSubmit(e) {
            e.preventDefault();
            const username = document.getElementById('authUsername').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            const errDiv = document.getElementById('authError');
            errDiv.style.display = 'none';

            const endpoint = isRegisterMode ? '/api/register' : '/api/login';

            try {
                const res = await fetch(`http://127.0.0.1:8000${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Lỗi hệ thống');

                localStorage.setItem('token', data.token);
                localStorage.setItem('username', data.username);
                closeAuthModal();
                checkAuthStatus();
            } catch (err) {
                errDiv.textContent = err.message;
                errDiv.style.display = 'block';
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            startNewConversation();
            checkAuthStatus();
        }

        // --- Load History List ---
        async function fetchUserChats() {
            const token = localStorage.getItem('token');
            if (!token) return;

            try {
                const res = await fetch('http://127.0.0.1:8000/api/chats', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) return;
                const chats = await res.json();

                chatHistoryContainer.innerHTML = '';
                chats.forEach(c => {
                    const item = document.createElement('div');
                    item.className = `history-item ${activeChatId === c.id ? 'active' : ''}`;
                    item.textContent = c.title;
                    item.onclick = () => loadChatDetail(c.id);
                    chatHistoryContainer.appendChild(item);
                });
            } catch (err) {
                console.error("Lỗi lấy lịch sử chat:", err);
            }
        }

        // --- Load Detailed History Chat ---
        async function loadChatDetail(chatId) {
            const token = localStorage.getItem('token');
            if (!token) return;

            try {
                const res = await fetch(`http://127.0.0.1:8000/api/chats/${chatId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) return;
                const chat = await res.json();

                activeChatId = chatId;
                chatContainer.innerHTML = ''; // Clear current UI
                chatHistory = []; // Reset local chat array

                chat.messages.forEach(msg => {
                    const box = createMessage(msg.role === 'user' ? 'user' : 'bot');
                    if (msg.role === 'user') {
                        box.textContent = msg.content;
                    } else {
                        box.innerHTML = `<div class="answer-text">${marked.parse(convertRawTableToMarkdown(msg.content))}</div>`;
                    }
                    chatHistory.push({ role: msg.role, content: msg.content });
                });

                fetchUserChats(); // highlight active item
            } catch (err) {
                console.error("Lỗi load chi tiết chat:", err);
            }
        }

        function startNewConversation() {
            activeChatId = null;
            chatHistory = [];
            chatContainer.innerHTML = `
                <div style="height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #0d0d0d;" id="welcomeView">
                    <h1 style="font-size: 28px; font-weight: 600; margin-bottom: 8px;">Legal Reasoning Engine</h1>
                    <p style="font-size: 14px; color: #6e6e80;">Truy xuất đa tầng &amp; Phân tích chuyên sâu luật Việt Nam</p>
                </div>
            `;
            docList.innerHTML = '<div style="text-align: center; padding-top: 60px; color: #b0b0bb; font-size: 13px;">No documents retrieved yet.</div>';
            fetchUserChats();
        }

        userInput.addEventListener('input', function () {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 200) + 'px';
        });

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleChat();
            }
        });

        sendBtn.addEventListener('click', handleChat);

        function convertRawTableToMarkdown(text) {
            const lines = text.split('\n');
            const resultLines = [];
            let i = 0;

            while (i < lines.length) {
                const line = lines[i];
                const parts = line.trim().split(/\t|\s{2,}/);

                if (parts.length >= 2 && line.trim() !== "" && !line.trim().startsWith('-') && !line.trim().startsWith('*') && !/^\d+\./.test(line.trim())) {
                    const tableRows = [];
                    while (i < lines.length) {
                        const currentLine = lines[i];
                        const currentParts = currentLine.trim().split(/\t|\s{2,}/);

                        if (currentParts.length >= 2 && currentLine.trim() !== "" && !currentLine.trim().startsWith('-') && !currentLine.trim().startsWith('*') && !/^\d+\./.test(currentLine.trim())) {
                            tableRows.push(currentParts.map(p => p.trim()));
                            i++;
                        } else {
                            break;
                        }
                    }

                    if (tableRows.length >= 2) {
                        const header = tableRows[0];
                        const alignmentRow = header.map(() => '---');
                        resultLines.push('| ' + header.join(' | ') + ' |');
                        resultLines.push('| ' + alignmentRow.join(' | ') + ' |');
                        for (let r = 1; r < tableRows.length; r++) {
                            resultLines.push('| ' + tableRows[r].join(' | ') + ' |');
                        }
                    } else if (tableRows.length === 1) {
                        resultLines.push(lines[i - tableRows.length]);
                    }
                } else {
                    resultLines.push(line);
                    i++;
                }
            }

            return resultLines.join('\n');
        }

        function createMessage(role) {
            const row = document.createElement('div');
            row.className = `message-row ${role}`;

            const avatar = document.createElement('div');
            avatar.className = `avatar ${role}`;
            avatar.textContent = role === 'user' ? 'U' : 'AI';

            const content = document.createElement('div');
            content.className = 'content';

            row.appendChild(avatar);
            row.appendChild(content);
            chatContainer.appendChild(row);
            return content;
        }

        function toggleConsole(id) {
            const body = document.getElementById(`console-body-${id}`);
            const arrow = document.getElementById(`arrow-${id}`);
            const isVisible = body.classList.contains('show');
            body.classList.toggle('show');
            arrow.textContent = isVisible ? '[+] Expand Logs' : '[-] Collapse Logs';
        }

        async function handleChat() {
            const query = userInput.value.trim();
            if (!query || isProcessing) return;

            const currentWelcome = document.getElementById('welcomeView');
            if (currentWelcome) currentWelcome.style.display = 'none';

            // User UI
            const userBox = createMessage('user');
            userBox.textContent = query;

            userInput.value = '';
            userInput.style.height = 'auto';
            isProcessing = true;
            sendBtn.disabled = true;

            // Bot UI Setup
            const botBox = createMessage('bot');
            const sessionID = Date.now();

            botBox.innerHTML = `
                <div class="thinking-console">
                    <div class="console-header" onclick="toggleConsole(${sessionID})">
                        <span>AGENT_REASONING_LOG</span>
                        <span id="arrow-${sessionID}">[-] Collapse Logs</span>
                    </div>
                    <div class="console-body show" id="console-body-${sessionID}"></div>
                    <div class="loading-line" id="loader-${sessionID}"></div>
                </div>
                <div id="actions-${sessionID}"></div>
                <div class="answer-text" id="answer-${sessionID}">...</div>
            `;

            const consoleBody = document.getElementById(`console-body-${sessionID}`);
            const answerArea = document.getElementById(`answer-${sessionID}`);
            const loader = document.getElementById(`loader-${sessionID}`);

            try {
                const token = localStorage.getItem('token');
                const headers = { 'Content-Type': 'application/json' };
                if (token) headers['Authorization'] = `Bearer ${token}`;

                const response = await fetch('http://127.0.0.1:8000/api/chat', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({
                        message: query,
                        chat_id: activeChatId,
                        history: chatHistory
                    })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let finalAnswer = "";
                let accumulatedThinking = "";
                let buffer = "";

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        const trimmedLine = line.trim();
                        if (trimmedLine.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(trimmedLine.substring(6));

                                if (data.new_chat_id) {
                                    activeChatId = data.new_chat_id;
                                    fetchUserChats();
                                }

                                if (data.docs && data.docs.length > 0) renderDocs(data.docs);

                                if (data.thinking) {
                                    accumulatedThinking += data.thinking;
                                    consoleBody.textContent = accumulatedThinking;
                                    consoleBody.style.whiteSpace = 'pre-wrap';
                                    consoleBody.scrollTop = consoleBody.scrollHeight;
                                }

                                if (data.answer) {
                                    finalAnswer += data.answer;
                                    const processedAnswer = convertRawTableToMarkdown(finalAnswer);

                                    if (typeof marked !== 'undefined') {
                                        answerArea.innerHTML = marked.parse(processedAnswer);
                                    } else {
                                        answerArea.textContent = finalAnswer;
                                        answerArea.style.whiteSpace = 'pre-wrap';
                                    }
                                }

                                chatContainer.scrollTop = chatContainer.scrollHeight;
                            } catch (parseError) {}
                        }
                    }
                }

                if (loader) loader.remove();
                chatHistory.push({ role: 'user', content: query });
                chatHistory.push({ role: 'assistant', content: finalAnswer });

            } catch (error) {
                console.error(error);
                if (answerArea) {
                    answerArea.innerHTML = `<span style="color:#d1293d">Error: Network connection failed. Please check backend server.</span>`;
                }
            } finally {
                isProcessing = false;
                sendBtn.disabled = false;
            }
        }

        function renderDocs(docs) {
            docList.innerHTML = '';
            docs.forEach((doc) => {
                const card = document.createElement('div');
                card.className = 'doc-card';
                card.onclick = () => card.classList.toggle('expanded');

                const totalScore = (doc.total_score || 0).toFixed(4);
                const sparseScore = (doc.sparse_score || 0).toFixed(4);
                const denseScore = (doc.dense_score || 0).toFixed(4);

                const metadata = doc.metadata || {};
                const lawId = metadata.law_id || 'DOCUMENT';
                const article = metadata.article || 'N/A';
                const chapter = metadata.chapter || '';

                let tagsHtml = '';
                if (chapter) tagsHtml += `<span class="doc-tag">${chapter}</span>`;
                if (article !== 'N/A') tagsHtml += `<span class="doc-tag">Article ${article}</span>`;

                card.innerHTML = `
                    <div class="doc-meta">
                        <div class="doc-meta-row">
                            <span class="doc-law-id">${lawId}</span>
                            <span class="doc-score">Score: ${totalScore}</span>
                        </div>
                        <div class="doc-sub-scores">
                            <span>Sparse: ${sparseScore}</span>
                            <span>Dense: ${denseScore}</span>
                        </div>
                    </div>
                    <span class="doc-title">${metadata.title || 'Untitled Section'}</span>
                    <div class="doc-content">${doc.text || 'No content available.'}</div>
                    <div class="doc-tags">${tagsHtml}</div>
                `;
                docList.appendChild(card);
            });
        }
    </script>
</body>
</html>
