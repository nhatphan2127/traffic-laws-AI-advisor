app:
  name: app
  version: 1.0.0
  env: production

# Secrets and connection strings come from environment variables / backend/.env
backend:
  jwt_secret:          # JWT_SECRET
  jwt_algorithm: HS256 # JWT_ALGORITHM
  mongodb_uri:         # MONGODB_URI
  db_name:             # DB_NAME

llm:
  provider: google_studio  # LLM_PROVIDER: google_studio | cloud_ollama | local_ollama
  temperature: 0.2         # LLM_TEMPERATURE
  max_tokens: 2048         # LLM_MAX_TOKENS

  google_studio_api_key:
  google_studio_model:

  cloud_ollama_url:
  cloud_ollama_key:
  cloud_ollama_model:

  local_ollama_url: http://localhost:11434/api/chat
  local_ollama_key:
  local_ollama_model: llama3.2

# Retrieval service, reached over MCP (Streamable HTTP)
mcp:
  retrieval_server_url: http://localhost:5555/mcp  # RETRIEVAL_MCP_URL
  request_timeout: 30                              # REQUEST_TIMEOUT (seconds)
